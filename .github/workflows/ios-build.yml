name: iOS Build

# Linux 上无法直接编译 iOS，这里把编译放到 GitHub 的 macOS runner 上。
#   - preflight：几秒跑完，检查工程完整性
#   - build-unsigned：不需要任何证书，验证"代码能不能编译、能不能打包"
#   - build-signed：手动触发并勾选 signed 时执行，需要先配置签名 secrets，产出 ipa
#
# 触发方式：Actions 页面 Run workflow，或 push 到 main/master。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 MARKETING_VERSION（留空用工程里的值）"
        required: false
        type: string
      build_number:
        description: "构建号 CURRENT_PROJECT_VERSION（留空用 run_number）"
        required: false
        type: string
      signed:
        description: "签名并导出 ipa（需要签名 secrets）"
        required: false
        type: boolean
        default: false
      upload:
        description: "导出后上传到 App Store Connect"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths-ignore:
      - "build/**"
      - "**/*.md"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: 工程预检（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查工程完整性
        run: python3 scripts/preflight.py

  build-unsigned:
    name: 编译验证（macOS，不签名）
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 模拟器编译（验证 Swift 源码）
        run: ./scripts/build-ios.sh --simulator

      - name: 不签名归档（验证打包链路）
        run: ./scripts/build-ios.sh --unsigned --no-export

      - name: 校验打包产物
        run: |
          set -euo pipefail
          ARCHIVE="$(ls -d build/*.xcarchive | head -1)"
          APP="$ARCHIVE/Products/Applications/IoTCenter.app"
          test -d "$APP" || { echo "❌ 归档里找不到 IoTCenter.app"; exit 1; }
          test -f "$APP/www/index.html" || { echo "❌ app 内缺少 www/index.html"; exit 1; }

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          FILES="$(find "$APP/www" -type f | wc -l | tr -d ' ')"
          SIZE="$(du -sh "$APP" | cut -f1)"
          ARCHS="$(lipo -archs "$APP/IoTCenter" 2>/dev/null || echo unknown)"

          {
            echo "## 打包产物校验"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | $VERSION ($BUILD) |"
            echo "| www 文件数 | $FILES |"
            echo "| 可执行文件架构 | $ARCHS |"
            echo "| app 体积 | $SIZE |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "app: $APP"
          echo "版本: $VERSION ($BUILD), www $FILES 个文件, 架构 $ARCHS, 体积 $SIZE"

      - name: 上传 xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: IoTCenter-unsigned-xcarchive
          path: build/*.xcarchive
          if-no-files-found: error

  build-signed:
    name: 签名导出 ipa
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.signed
    runs-on: macos-15
    env:
      PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 检查签名配置
        run: |
          set -euo pipefail
          [ -n "${PROFILE_NAME:-}" ] || { echo "缺少 secrets.PROFILE_NAME（描述文件名称）"; exit 1; }
          [ -n "${SIGNING_IDENTITY:-}" ] || { echo "缺少 secrets.SIGNING_IDENTITY（如 Apple Distribution: xxx）"; exit 1; }

      - name: 导入签名证书
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | python3 -c "import base64,sys;open('$CERT_PATH','wb').write(base64.b64decode(sys.stdin.read()))"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: 安装描述文件
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | python3 -c "import base64,sys;open('$PROFILE_PATH','wb').write(base64.b64decode(sys.stdin.read()))"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: 归档并导出
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          ARGS=(--method app-store-connect)
          if [ -n "$INPUT_VERSION" ]; then ARGS+=(--version "$INPUT_VERSION"); fi
          if [ -n "$INPUT_BUILD" ]; then ARGS+=(--build-number "$INPUT_BUILD"); fi
          ./scripts/build-ios.sh "${ARGS[@]}"

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: IoTCenter-ipa
          path: build/export-*/*.ipa
          if-no-files-found: error

      - name: 上传 App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA="$(find build -type f -name '*.ipa' | head -1)"
          xcrun altool --upload-app --file "$IPA" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
